<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCT DETAILS | GLITCHGARB</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            margin-top: 4rem;
        }

        .product-main-image {
            width: 100%;
            height: 600px;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .zoom-lens {
            position: absolute;
            border: 1px solid var(--accent-color);
            width: 100px;
            height: 100px;
            background: rgba(0, 255, 255, 0.1);
            display: none;
            pointer-events: none;
        }

        .zoom-results {
            position: absolute;
            top: 0;
            right: -110%;
            width: 100%;
            height: 100%;
            border: 1px solid var(--border-color);
            display: none;
            z-index: 10;
            background: var(--main-bg);
        }

        .product-meta {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .size-selector {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        /* Product Image Color Overlay Effects */
        .product-main-image {
            position: relative;
            transition: all 0.6s ease;
        }

        .product-main-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0;
            transition: all 0.6s ease;
            mix-blend-mode: color;
            pointer-events: none;
            z-index: 1;
        }

        .product-main-image.color-white::before {
            background: #ffffff;
            opacity: 0.5;
            mix-blend-mode: soft-light;
        }

        .product-main-image.color-gray::before {
            background: #666666;
            opacity: 0.4;
            mix-blend-mode: multiply;
        }

        .product-main-image.color-navy::before {
            background: #1a237e;
            opacity: 0.5;
            mix-blend-mode: multiply;
        }

        .product-main-image.color-black::before {
            opacity: 0;
        }

        /* Color preview label */
        .color-preview-label {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--accent-color);
            padding: 0.5rem 1rem;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--accent-color);
            z-index: 10;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.4s ease;
        }

        .color-preview-label.show {
            opacity: 1;
            transform: translateX(0);
        }

        .size-btn {
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            background: none;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        .size-btn:hover,
        .size-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .product-description {
            line-height: 1.6;
            opacity: 0.8;
            font-size: 0.9rem;
        }

        /* Color and Size Selectors */
        .selector-group {
            margin-top: 2rem;
        }

        .selector-label {
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            opacity: 0.5;
            margin-bottom: 1rem;
            display: block;
            text-transform: uppercase;
        }

        .size-selector {
            display: flex !important;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            opacity: 1 !important;
            transform: none !important;
        }

        /* Color Swatch Buttons */
        .color-btn {
            width: 50px;
            height: 50px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .color-btn:hover {
            border-color: var(--accent-color);
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: var(--accent-color);
            border-width: 3px;
            box-shadow: 0 0 15px rgba(255, 62, 0, 0.3);
        }

        .color-btn.active::after {
            content: '\2713';
            position: absolute;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .color-btn.active[data-color="White"]::after {
            color: #000;
        }

        /* Size Buttons */
        .size-btn {
            border: 2px solid var(--border-color);
            padding: 1rem 1.5rem;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 700;
            min-width: 60px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }

        .size-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent-color);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .size-btn:hover::before {
            left: 0;
        }

        .size-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-color);
        }

        .size-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #000;
            font-weight: 900;
        }

        .size-btn.active::before {
            display: none;
        }

        /* Mobile Responsiveness */
        @media (max-width: 1024px) {
            .product-detail-grid {
                gap: 2rem;
            }

            .product-main-image {
                height: 450px;
            }
        }

        @media (max-width: 768px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
                margin-top: 2rem;
            }

            .product-main-image {
                height: 350px;
            }

            .product-meta h1 {
                font-size: 1.75rem;
            }

            .size-selector {
                flex-wrap: wrap;
            }

            .size-btn {
                padding: 0.75rem 1rem;
                min-width: 50px;
                font-size: 0.85rem;
            }

            .color-btn {
                width: 40px;
                height: 40px;
            }

            #p-price {
                font-size: 1.25rem;
            }

            /* Hide zoom on mobile */
            .zoom-lens,
            .zoom-results {
                display: none !important;
            }
        }

        @media (max-width: 480px) {
            .product-main-image {
                height: 280px;
            }

            .product-meta h1 {
                font-size: 1.5rem;
            }

            .size-btn {
                padding: 0.6rem 0.8rem;
                min-width: 45px;
                font-size: 0.8rem;
            }

            .color-btn {
                width: 35px;
                height: 35px;
            }

            .selector-label {
                font-size: 0.65rem;
            }

            #add-to-cart-btn,
            #buy-btn {
                padding: 1rem !important;
                font-size: 0.85rem !important;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

            <a href="/" class="logo"><img src="logo.png" alt="GLITCHGARB" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=&quot;font-size:1.2rem;font-weight:800;&quot;>GLITCHGARB</span>'"></a>

        <a href="/">Home</a>

    <main class="container">
        <div class="product-detail-grid fade-in" id="product-container">
            <!-- Product details loaded via JS -->

    <script src="config.js?v=13"></script>
    <script src="api-service.js?v=13"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mobile Menu Toggle
            const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
            const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');
            const mobileMenu = document.getElementById('mobile-menu');
            const mobileMenuClose = document.getElementById('mobile-menu-close');

            function openMobileMenu() {
                mobileMenu.classList.add('open');
                mobileMenuOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeMobileMenu() {
                mobileMenu.classList.remove('open');
                mobileMenuOverlay.classList.remove('open');
                document.body.style.overflow = '';
            }

            if (mobileMenuToggle) {
                mobileMenuToggle.addEventListener('click', openMobileMenu);
            }
            if (mobileMenuClose) {
                mobileMenuClose.addEventListener('click', closeMobileMenu);
            }
            if (mobileMenuOverlay) {
                mobileMenuOverlay.addEventListener('click', closeMobileMenu);
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeMobileMenu();
                }
            });

            // Update auth links based on login status
            const authLink = document.getElementById('auth-link');
            const profileLink = document.getElementById('profile-link');
            const mobileAuthLink = document.getElementById('mobile-auth-link');
            const mobileProfileLink = document.getElementById('mobile-profile-link');
            const mobileLogoutLink = document.getElementById('mobile-logout-link');

            function updateAuthLinks() {
                const user = apiService.getCurrentUser();
                if (user) {
                    if (authLink) authLink.style.display = 'none';
                    if (profileLink) profileLink.style.display = 'inline-block';
                    if (mobileAuthLink) mobileAuthLink.style.display = 'none';
                    if (mobileProfileLink) mobileProfileLink.style.display = 'block';
                    if (mobileLogoutLink) mobileLogoutLink.style.display = 'block';
                } else {
                    if (authLink) authLink.style.display = 'inline-block';
                    if (profileLink) profileLink.style.display = 'none';
                    if (mobileAuthLink) mobileAuthLink.style.display = 'block';
                    if (mobileProfileLink) mobileProfileLink.style.display = 'none';
                    if (mobileLogoutLink) mobileLogoutLink.style.display = 'none';
                }
            }

            updateAuthLinks();
            window.addEventListener('storage', updateAuthLinks);

            // Mobile logout handler
            if (mobileLogoutLink) {
                mobileLogoutLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    apiService.logout();
                });
            }

            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            // Load product asynchronously
            async function loadProduct() {
                const product = await apiService.getProduct(productId);
                
                if (!product) {
                    window.location.href='/shop';
                    return;
                }
                
                 // Update UI
                 const rawImgSrc = product.image || (product.images && product.images.length > 0 ? product.images[0] : '') || '';
                 const imgSrc = rawImgSrc && !rawImgSrc.startsWith('http') && !rawImgSrc.startsWith('/') && !rawImgSrc.startsWith('data:image/') 
                     ? `data:image/jpeg;base64,${rawImgSrc}` 
                     : rawImgSrc;

                 document.getElementById('p-name').textContent = product.name;
                 document.getElementById('p-price').textContent = `GH₵ ${product.price.toFixed(2)}`;
                 document.getElementById('main-img-element').style.backgroundImage = `url('${imgSrc}')`;
                 if (document.getElementById('p-desc')) document.getElementById('p-desc').textContent = product.description;

                 // Render gallery images
                 const galleryContainer = document.getElementById('product-gallery');
                 const mainImg = document.getElementById('main-img-element');
                 const zoomResult = document.getElementById('zoom-result');
                 let currentZoomImg = imgSrc;

                 let galleryData = product.gallery;
                 if (typeof galleryData === 'string' && galleryData.startsWith('[')) {
                     try { galleryData = JSON.parse(galleryData); } catch(e) { galleryData = []; }
                 }

                 const debugEl = document.getElementById('gallery-debug');
                 if (galleryData && Array.isArray(galleryData) && galleryData.length > 0) {
                     galleryContainer.innerHTML = '';
                     galleryContainer.style.display = 'flex';
                     
                     const allImages = [imgSrc, ...galleryData].filter(url => url);
                     if (debugEl) debugEl.textContent = `${allImages.length} images available`;
                     
                     allImages.forEach((item, idx) => {
                         const url = typeof item === 'string' ? item : (item.url || '');
                         if (!url) return;
                         
                         const thumbImg = document.createElement('img');
                         thumbImg.src = url;
                         thumbImg.alt = `View ${idx + 1}`;
                         thumbImg.className = 'gallery-thumb';
                         thumbImg.style.cssText = 'width:70px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid var(--border-color);flex-shrink:0;transition:all 0.2s ease;';
                         
                         if (idx === 0) thumbImg.style.borderColor = 'var(--accent-color)';
                         
                         thumbImg.onclick = function() {
                             mainImg.style.backgroundImage = `url('${this.src}')`;
                             currentZoomImg = this.src;
                             if (zoomResult) zoomResult.style.backgroundImage = `url('${this.src}')`;
                             galleryContainer.querySelectorAll('.gallery-thumb').forEach(img => img.style.borderColor = 'var(--border-color)');
                             this.style.borderColor = 'var(--accent-color)';
                         };
                         galleryContainer.appendChild(thumbImg);
                     });
                 } else {
                     galleryContainer.style.display = 'none';
                     if (debugEl) debugEl.textContent = 'No gallery images';
                 }

                const buyBtn = document.getElementById('buy-btn');
                const addToCartBtn = document.getElementById('add-to-cart-btn');
                const isSoldOut = product.stock === 0;
                const isLive = new Date(product.releaseDate || product.drop_date) <= new Date();
                
                // Dynamic color/size selection state
                const productMainImage = document.getElementById('zoom-container');
                const colorPreviewLabel = document.getElementById('color-preview-label');
                let selectedColor = (product.colors && product.colors[0]) || 'Black';
                let selectedSize = (product.sizes && product.sizes[0]) || 'M';
                
                // Render dynamic color selector from product data
                const colorSelector = document.getElementById('color-selector');
                const productColors = product.colors || [];
                if (productColors.length > 0) {
                    colorSelector.innerHTML = '';
                    const colorHexMap = {
                        'Black': '#000000', 'White': '#ffffff', 'Gray': '#666666',
                        'Navy': '#1a237e', 'Red': '#c62828', 'Green': '#2e7d32',
                        'Brown': '#5d4037', 'Beige': '#d4c4b7', 'Blue': '#1565c0',
                        'Orange': '#e65100', 'Yellow': '#f9a825', 'Pink': '#c2185b'
                    };
                    productColors.forEach((color, idx) => {
                        const hex = colorHexMap[color] || '#333333';
                        const btn = document.createElement('button');
                        btn.className = 'color-btn' + (idx === 0 ? ' active' : '');
                        btn.dataset.color = color;
                        btn.style.background = hex;
                        btn.title = color;
                        btn.addEventListener('click', () => {
                            colorBtns.forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            selectedColor = color;
                            productMainImage.className = 'product-main-image color-black';
                            productMainImage.classList.add(`color-${selectedColor.toLowerCase()}`);
                            colorPreviewLabel.textContent = `COLOR: ${selectedColor.toUpperCase()}`;
                            colorPreviewLabel.classList.add('show');
                            setTimeout(() => { colorPreviewLabel.classList.remove('show'); }, 2000);
                        });
                        colorSelector.appendChild(btn);
                    });
                }
                // Re-query color buttons after dynamic render
                const colorBtns = document.querySelectorAll('#color-selector .color-btn');
                
                // Render dynamic size selector from product data
                const sizeSelector = document.getElementById('size-selector');
                const productSizes = product.sizes || [];
                if (productSizes.length > 0) {
                    sizeSelector.innerHTML = '';
                    productSizes.forEach((size, idx) => {
                        const btn = document.createElement('button');
                        btn.className = 'size-btn' + (size === 'M' ? ' active' : '');
                        btn.dataset.size = size;
                        btn.textContent = size;
                        btn.addEventListener('click', () => {
                            sizeBtns.forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            selectedSize = size;
                        });
                        sizeSelector.appendChild(btn);
                    });
                }
                // Re-query size buttons after dynamic render
                const sizeBtns = document.querySelectorAll('#size-selector .size-btn');
                
                // Handle sold out / not live states
                if (isSoldOut) {
                    buyBtn.textContent = 'SOLD OUT';
                    buyBtn.disabled = true;
                    addToCartBtn.disabled = true;
                    addToCartBtn.textContent = 'SOLD OUT';
                } else if (!isLive) {
                    buyBtn.textContent = 'COMING SOON';
                    buyBtn.disabled = true;
                    addToCartBtn.disabled = true;
                    addToCartBtn.textContent = 'COMING SOON';
                } else {
                    // Buy Now button
                    buyBtn.onclick = () => {
                        if (!selectedSize) { alert('Please select a size'); return; }
                        window.location.href = `/checkout?id=${product.id}&size=${selectedSize}&color=${selectedColor}`;
                    };
                    
                    // Add to Cart button
                    addToCartBtn.onclick = async () => {
                        if (!selectedSize) { alert('Please select a size'); return; }
                        
                        const cartItem = {
                            product_id: String(product.id),
                            name: String(product.name),
                            price: parseFloat(product.price),
                            size: selectedSize,
                            color: selectedColor || '',
                            image: currentZoomImg || imgSrc,
                            quantity: 1
                        };
                        
                        try {
                            const result = await apiService.addToCart(cartItem);
                            if (result.success) {
                                window.location.href='/cart';
                            } else {
                                alert('Failed: ' + (result.message || 'Unknown error'));
                            }
                        } catch (error) {
                            console.error('Add to cart error:', error);
                            alert('Error adding to cart. Please try again.');
                        }
                    };
                }
                
                // Initialize other components
                if (typeof ViewingStats !== 'undefined') { new ViewingStats('viewing-stats-container'); }
                if (isLive) { new StockCounter('stock-status', product.stock, 50); }
                initZoom('zoom-container', 'main-img-element', 'lens', 'zoom-result', () => currentZoomImg);
            }
            
            // Call loadProduct to initialize
            loadProduct();
        });

        function initZoom(containerId, imgId, lensId, resultId, imgUrl) {
            const container = document.getElementById(containerId);
            const img = document.getElementById(imgId);
            const lens = document.getElementById(lensId);
            const result = document.getElementById(resultId);

            container.addEventListener('mousemove', (e) => {
                lens.style.display = 'block';
                result.style.display = 'block';

                const rect = container.getBoundingClientRect();
                let x = e.pageX - rect.left - window.pageXOffset;
                let y = e.pageY - rect.top - window.pageYOffset;

                // Clamp lens position
                x = Math.max(0, Math.min(x - lens.offsetWidth / 2, container.offsetWidth - lens.offsetWidth));
                y = Math.max(0, Math.min(y - lens.offsetHeight / 2, container.offsetHeight - lens.offsetHeight));

                lens.style.left = x + 'px';
                lens.style.top = y + 'px';

                // Zoom background
                const cx = result.offsetWidth / lens.offsetWidth;
                const cy = result.offsetHeight / lens.offsetHeight;

                const currentImg = typeof imgUrl === 'function' ? imgUrl() : imgUrl;
                result.style.backgroundImage = `url('${currentImg}')`;
                result.style.backgroundSize = (container.offsetWidth * cx) + 'px ' + (container.offsetHeight * cy) + 'px';
                result.style.backgroundPosition = `-${x * cx}px -${y * cy}px`;
            });

            container.addEventListener('mouseleave', () => {
                lens.style.display = 'none';
                result.style.display = 'none';
            });
        }
    </script>
</body>

</html>
