<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECKOUT | GLITCHGARB</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 4rem;
            margin-top: 4rem;
        }

        .checkout-section {
            border: 1px solid var(--border-color);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .checkout-section h2 {
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
            opacity: 0.6;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            margin-bottom: 0.5rem;
            opacity: 0.5;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: none;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 1rem;
            font-family: inherit;
        }

        .payment-methods {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .pay-method {
            flex: 1;
            border: 1px solid var(--border-color);
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            opacity: 0.5;
        }

        .pay-method.active {
            border-color: var(--accent-color);
            opacity: 1;
            background: rgba(0, 255, 255, 0.05);
        }

        .order-summary {
            position: sticky;
            top: 2rem;
            height: fit-content;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .summary-total {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .product-preview {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .product-preview img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
                gap: 2rem;
                margin-top: 2rem;
            }

            .order-summary {
                position: relative;
                top: 0;
                order: -1;
            }

            .checkout-section {
                padding: 1.5rem;
            }

            .payment-methods {
                flex-direction: column;
            }

            .pay-method {
                padding: 1.5rem 1rem;
            }

            .product-preview {
                flex-direction: column;
                align-items: flex-start;
            }

            .product-preview img {
                width: 100%;
                max-width: 120px;
                height: auto;
                aspect-ratio: 1;
            }

            .form-group input,
            .form-group select {
                padding: 0.875rem;
                font-size: 16px;
                /* Prevents zoom on iOS */
            }

            .summary-item {
                font-size: 0.85rem;
            }

            .summary-total {
                font-size: 1.1rem;
            }

            #place-order-btn {
                width: 100%;
                padding: 1.25rem;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .checkout-section {
                padding: 1rem;
            }

            .checkout-section h2 {
                font-size: 0.7rem;
            }

            .form-group label {
                font-size: 0.65rem;
            }

            .pay-method {
                padding: 1rem;
            }

            .pay-method svg {
                width: 20px;
                height: 20px;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="/" class="logo"><img src="logo.png" alt="GLITCHGARB" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=&quot;font-size:1.2rem;font-weight:800;&quot;>GLITCHGARB</span>'"></a>

                    </div>
                    <div class="form-group">

                        <select id="ship-country">
                            <option value="">Select Country</option>

                            <option value="Nigeria">Nigeria</option>
                            <option value="Kenya">Kenya</option>
                            <option value="South Africa">South Africa</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>

                    </div>

                    <div class="payment-methods">
                        <div class="pay-method active" data-method="card">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"

                                <rect x="2" y="5" width="20" height="14" rx="2" />
                                <line x1="2" y1="10" x2="22" y2="10" />
                            </svg>

                        </div>
                        <div class="pay-method" data-method="momo">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" style="margin-bottom: 0.5rem;">
                                <path d="M12 2L2 7l10 5 10-5-10-5z" />
                                <path d="M2 17l10 5 10-5" />
                                <path d="M2 12l10 5 10-5" />
                            </svg>
                            <div style="font-size: 0.7rem;">MOBILE MONEY</div>
                        </div>
                        <div class="pay-method" data-method="bank">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" style="margin-bottom: 0.5rem;">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                            <div style="font-size: 0.7rem;">BANK TRANSFER</div>
                        </div>
                    </div>

                    <div id="payment-fields">
                        <!-- Card Payment Fields -->
                        <div id="card-fields" class="payment-field-group">
                            <div class="form-group">
                                <label>CARDHOLDER NAME</label>
                                <input type="text" id="card-name" placeholder="Name on card">
                            </div>
                            <div class="form-group">
                                <label>CARD NUMBER</label>
                                <input type="text" id="card-number" placeholder="1234 5678 9012 3456" maxlength="19">
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div class="form-group">
                                    <label>EXPIRY DATE</label>
                                    <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5">
                                </div>
                                <div class="form-group">
                                    <label>CVV</label>
                                    <input type="text" id="card-cvv" placeholder="123" maxlength="4">
                                </div>
                            </div>
                        </div>

                        <!-- Mobile Money Fields -->
                        <div id="momo-fields" class="payment-field-group" style="display: none;">
                            <div class="form-group">
                                <label>MOBILE NETWORK</label>
                                <select id="momo-provider">
                                    <option value="mtn">MTN Mobile Money</option>
                                    <option value="vod">Vodafone Cash</option>
                                    <option value="tgo">AirtelTigo Money</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>MOBILE NUMBER</label>
                                <input type="tel" id="momo-number" placeholder="024 XXX XXXX">
                            </div>
                        </div>

                        <!-- Bank Transfer Fields -->
                        <div id="bank-fields" class="payment-field-group" style="display: none;">
                            <div class="form-group">
                                <label>BANK NAME</label>
                                <select id="bank-name">
                                    <option value="gcb">GCB Bank</option>
                                    <option value="ecobank">Ecobank Ghana</option>
                                    <option value="stanbic">Stanbic Bank</option>
                                    <option value="absa">Absa Bank Ghana</option>
                                    <option value="calbank">CalBank</option>
                                    <option value="fid">Fidelity Bank</option>
                                    <option value="zenith">Zenith Bank</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>ACCOUNT NUMBER</label>
                                <input type="text" id="bank-account" placeholder="Enter account number">
                            </div>
                        </div>
                    </div>
                </div>

                <button class="btn" id="finish-checkout" style="width: 100%; padding: 1.5rem;">AUTHORIZE PAYMENT</button>
            </div>

            <div class="order-summary">
                <div class="checkout-section">
                    <h2>ORDER SUMMARY</h2>
                    <div id="summary-content">
                        <!-- Loaded from URL params -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://js.paystack.co/v1/inline.js"></script>

    <script>

        const countryData = {

        function updateRegions(country) {
            const regionSelect = document.getElementById('ship-region');
            const cityInput = document.getElementById('ship-city');
            const postalInput = document.getElementById('ship-postal');
            const postalLabel = document.getElementById('postal-label');
            regionSelect.innerHTML = '<option value="">Select Region</option>';

            if (country && countryData[country]) {
                const data = countryData[country];
                data.regions.forEach(region => {
                    const option = document.createElement('option');
                    option.value = region;
                    option.textContent = region;
                    regionSelect.appendChild(option);
                });
                
                // Select first region by default if available
                if (data.regions.length > 0) {
                    regionSelect.selectedIndex = 1;
                }
                
                cityInput.placeholder = data.cityPlaceholder;
                postalInput.placeholder = data.postalPlaceholder;
                if (postalLabel) postalLabel.textContent = data.postalLabel;
            } else {
                cityInput.placeholder = 'Enter your city';
                postalInput.placeholder = 'Enter postal code';
                if (postalLabel) postalLabel.textContent = 'POSTAL CODE (OPTIONAL)';
            }
        }

        let checkoutItems = [];
        let checkoutSubtotal = 0;
        let checkoutShipping = 0;
        let checkoutTotal = 0;
        let selectedMethod = 'card';
        let productId, size, isCartCheckout;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            isCartCheckout = params.get('cart') === 'true';
            productId = params.get('id');
            size = params.get('size');

            if (isCartCheckout) {
                const cartObj = await storageService.getCart();
                checkoutItems = cartObj.items || (Array.isArray(cartObj) ? cartObj : []);
                
                if (!checkoutItems.length) {
                    Toast.warning('Your cart is empty');
                    setTimeout(() => window.location.href='/shop', 1500);
                    return;
                }
                
                checkoutSubtotal = cartObj.subtotal || 0;
                checkoutShipping = cartObj.shipping || 0;
                checkoutTotal = cartObj.total || 0;
            } else {
                const product = await apiService.getProduct(productId);
                if (!product || !size) {
                    Toast.error('Invalid product or size selected');
                    setTimeout(() => window.location.href='/shop', 1500);
                    return;
                }
                const qty = parseInt(params.get('qty')) || 1;
                checkoutItems = [{
                    id: 'single',
                    productId,
                    productName: product.name,
                    productImage: product.image,
                    price: product.price,
                    size,
                    color: params.get('color') || 'Black',
                    quantity: qty
                }];
                checkoutSubtotal = product.price * qty;
                checkoutShipping = checkoutSubtotal > 100 ? 0 : 9.99;
                checkoutTotal = checkoutSubtotal + checkoutShipping;
            }

            updateRegions('Ghana');
            document.getElementById('ship-country').addEventListener('change', (e) => updateRegions(e.target.value));

            const summaryContent = document.getElementById('summary-content');
            summaryContent.innerHTML = `
                ${checkoutItems.map(item => `
                    <div class="product-preview" style="margin-bottom: 1rem;">
                        <img src="${item.productImage || item.image}" alt="${item.productName || item.name}">
                        <div>
                            <div style="font-weight: bold;">${item.productName || item.name}</div>
                            <div style="opacity: 0.6; font-size: 0.8rem;">COLOR: ${item.color} | SIZE: ${item.size} | QTY: ${item.quantity}</div>
                        </div>
                    </div>
                `).join('')}
                <div class="summary-item">
                    <span>Subtotal (${checkoutItems.reduce((sum, item) => sum + (item.quantity || 1), 0)} items)</span>
                    <span>GH₵ ${checkoutSubtotal.toFixed(2)}</span>
                </div>
                <div class="summary-item">
                    <span>Shipping</span>
                    <span>${checkoutShipping === 0 ? 'FREE' : 'GH₵ ' + checkoutShipping.toFixed(2)}</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span>GH₵ ${checkoutTotal.toFixed(2)}</span>
                </div>
            `;

            const payMethods = document.querySelectorAll('.pay-method');
            const paymentFieldGroups = document.querySelectorAll('.payment-field-group');
            payMethods.forEach(method => {
                method.addEventListener('click', () => {
                    payMethods.forEach(m => m.classList.remove('active'));
                    method.classList.add('active');
                    selectedMethod = method.dataset.method;
                    paymentFieldGroups.forEach(group => group.style.display = 'none');
                    document.getElementById(`${selectedMethod}-fields`).style.display = 'block';
                });
            });

            // Input formatters
            const cardNumberInput = document.getElementById('card-number');
            if (cardNumberInput) {
                cardNumberInput.addEventListener('input', (e) => {
                    let v = e.target.value.replace(/\s/g, '').replace(/\D/g, '');
                    e.target.value = v.replace(/(.{4})/g, '$1 ').trim();
                });
            }
            const cardExpiryInput = document.getElementById('card-expiry');
            if (cardExpiryInput) {
                cardExpiryInput.addEventListener('input', (e) => {
                    let v = e.target.value.replace(/\D/g, '');
                    if (v.length >= 2) e.target.value = v.substring(0, 2) + '/' + v.substring(2, 4);
                });
            }
            const cardCvvInput = document.getElementById('card-cvv');
            if (cardCvvInput) cardCvvInput.addEventListener('input', (e) => e.target.value = e.target.value.replace(/\D/g, ''));

            document.getElementById('finish-checkout').addEventListener('click', async () => {
                console.log('Authorize Payment clicked');
                
                const shipping = {
                    name: document.getElementById('ship-name').value.trim(),
                    phone: document.getElementById('ship-phone').value.trim(),
                    email: document.getElementById('ship-email').value.trim(),
                    address: document.getElementById('ship-address').value.trim(),
                    country: document.getElementById('ship-country').value,
                    city: document.getElementById('ship-city').value.trim(),
                    region: document.getElementById('ship-region').value,
                    postalCode: document.getElementById('ship-postal').value.trim(),
                    instructions: document.getElementById('ship-instructions').value.trim()
                };

                console.log('Shipping data:', shipping);

                if (!shipping.name || !shipping.phone || !shipping.email || !shipping.address || !shipping.country || !shipping.city || !shipping.region) {
                    const missing = [];
                    if (!shipping.name) missing.push('Name');
                    if (!shipping.phone) missing.push('Phone');
                    if (!shipping.email) missing.push('Email');
                    if (!shipping.address) missing.push('Address');
                    if (!shipping.country) missing.push('Country');
                    if (!shipping.city) missing.push('City');
                    if (!shipping.region) missing.push('Region');
                    
                    console.warn('Validation failed. Missing fields:', missing);
                    Toast.error('Please fill in all required shipping fields: ' + missing.join(', '));
                    return;
                }

                console.log('Payment method:', selectedMethod);

                if (selectedMethod === 'card') {
                    if (!document.getElementById('card-name').value || !document.getElementById('card-number').value || !document.getElementById('card-expiry').value || !document.getElementById('card-cvv').value) {
                        Toast.error('Please fill in all card details');
                        return;
                    }
                } else if (selectedMethod === 'momo' && !document.getElementById('momo-number').value) {
                    Toast.error('Please enter mobile number');
                    return;
                } else if (selectedMethod === 'bank' && !document.getElementById('bank-account').value) {
                    Toast.error('Please enter account number');
                    return;
                }

                const finishBtn = document.getElementById('finish-checkout');
                finishBtn.classList.add('loading');
                finishBtn.disabled = true;

                const metadata = {
                    shipping,
                    paymentMethod: selectedMethod,
                    isCartCheckout,
                    items: checkoutItems
                };

                // Build order data
                const orderData = {
                    shipping_address: shipping,
                    customer_info: {
                        name: shipping.name,
                        email: shipping.email,
                        phone: shipping.phone
                    },
                    payment_method: selectedMethod,
                    subtotal: checkoutSubtotal,
                    shipping: checkoutShipping,
                    tax: 0,
                    total: checkoutTotal,
                    items: checkoutItems.map(item => ({
                        productId: item.productId || item.product_id || productId,
                        name: item.productName || item.name,
                        image: item.productImage || item.image,
                        price: item.price,
                        size: item.size || size,
                        color: item.color || 'Black',
                        quantity: item.quantity || 1
                    }))
                };

                // Save order data for the success page
                sessionStorage.setItem('pending_order', JSON.stringify(orderData));

                // Open Paystack immediately - don't wait for order creation
                payWithPaystack(shipping.email, checkoutTotal, metadata, selectedMethod, orderData);
            });
        });

        function payWithPaystack(email, amount, metadata, paymentMethod, orderData) {
            console.log(`payWithPaystack called: email=${email}, amount=${amount}, method=${paymentMethod}`);
            
            if (DEMO_MODE) {
                console.log('Using DEMO MODE');
                Toast.info('Processing payment (Demo Mode)...');
                setTimeout(async () => {
                    try {
                        const ref = 'DEMO-' + Date.now();
                        console.log('Creating demo order with ref:', ref);
                        const customer_info = {
                            name: metadata.shipping.name,
                            email: metadata.shipping.email,
                            phone: metadata.shipping.phone
                        };

                        const orderData = {
                            shipping_address: metadata.shipping,
                            customer_info: customer_info,
                            payment_method: 'Demo',
                            payment_reference: ref,
                            subtotal: checkoutTotal,
                            total: checkoutTotal,
                            items: checkoutItems.map(item => ({
                                productId: item.productId || item.product_id || productId,
                                name: item.productName || item.name,
                                image: item.productImage || item.image,
                                price: item.price,
                                size: item.size || size,
                                color: item.color || 'Black',
                                quantity: item.quantity || 1
                            }))
                        };

                        const orderResult = isCartCheckout ? 
                            await apiService.createOrderFromCart(orderData) :
                            await apiService.createOrder(orderData);

                        if (orderResult.success) {
                            console.log('Order created successfully:', orderResult);
                            Toast.success('Payment successful!');
                            if (isCartCheckout) await storageService.clearCart();
                            setTimeout(() => window.location.href = `/order-success?orderId=${orderResult.order.id}`, 1500);
                        } else {
                            console.warn('Order creation failed:', orderResult.message);
                            Toast.error(orderResult.message);
                            resetBtn();
                        }
                    } catch (e) {
                        console.error('Demo order creation exception:', e);
                        Toast.error('Order creation failed');
                        resetBtn();
                    }
                }, 2000);
                return;
            }

            if (typeof PaystackPop === 'undefined') {
                console.error('PaystackPop is not defined! Check if inline.js is loaded.');
                Toast.error('Payment system error. Please refresh the page.');
                resetBtn();
                return;
            }

            console.log('Setting up PaystackPop...');
            const handler = PaystackPop.setup({
                key: PAYSTACK_PUBLIC_KEY,
                email,
                amount: Math.round(amount * 100),
                currency: 'GHS',
                ref: 'GG-' + Date.now(),
                callback: function (response) {
                    console.log('Paystack callback received:', response);
                    // Check if payment was successful
                    if (response.status === 'success') {
                        window.location.href = `/order-success?ref=${response.reference}`;
                    } else {
                        // Payment failed or was declined
                        window.location.href = `/order-failed?ref=${response.reference}&code=${response.status}&message=${encodeURIComponent(response.message || 'Payment was not successful')}`;
                    }
                },
                onClose: function () {
                    console.log('Paystack popup closed');
                    // User closed the popup � redirect to failed page
                    window.location.href = `/order-failed?code=cancelled&message=${encodeURIComponent('You cancelled the payment. No charges were made.')}`;
                }
            });
            
            console.log('Opening Paystack iframe...');
            handler.openIframe();
        }

        function resetBtn() {
            const btn = document.getElementById('finish-checkout');
            btn.classList.remove('loading');
            btn.disabled = false;
        }
    </script>
</body>

</html>
