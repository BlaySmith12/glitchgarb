# GlitchGarb nginx config - HTTPS with Let's Encrypt.
# AFTER obtaining certs with certbot (see DEPLOY_VPS.md), copy over nginx.conf:
#   cp docker/nginx/nginx-ssl.conf docker/nginx/nginx.conf
#   docker compose restart web

# HTTP -> HTTPS redirect (with ACME challenge exception for cert renewal)
server {
    listen 80;
    server_name glitchgarb.com www.glitchgarb.com auth.glitchgarb.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name glitchgarb.com www.glitchgarb.com auth.glitchgarb.com;

    ssl_certificate /etc/letsencrypt/live/glitchgarb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glitchgarb.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (mirrors vercel.json) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "frame-src 'self' https://js.paystack.co https://paystack.com https://*.paystack.com; script-src 'self' 'unsafe-inline' https://js.paystack.co; connect-src 'self' https://js.paystack.co https://*.paystack.com; img-src 'self' data: https:;" always;

    # --- Reverse proxy for the FastAPI backend ---
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Static files + clean URLs (/shop -> /shop.html) ---
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # --- Clean product URLs: /product/123 -> /product.html?id=123 ---
    location ~ ^/product/([^/]+)$ {
        rewrite ^/product/([^/]+)$ /product.html?id=$1 break;
    }

    # --- Cache static assets ---
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
