services:
  - type: web
    name: glitchgarb-api
    runtime: python
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt && echo "build $(date)" > /tmp/build.txt
    startCommand: cd /opt/render/project/src/backend-python && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: '10080'
      - key: REFRESH_EXPIRE_DAYS
        value: '30'
      - key: PORT
        value: '10000'
      - key: FRONTEND_URL
        sync: false
      - key: ENV
        value: production
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: LOGO_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
