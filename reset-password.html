<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - GlitchGarb</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .reset-container {
            max-width: 500px;
            margin: 100px auto;
            padding: 40px;
            background: var(--darker);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .reset-header h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .message.success {
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.3);
            color: #00ff9d;
        }
        .message.error {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: #ff3366;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            margin-top: 20px;
            transition: var(--transition);
        }
        .back-link:hover {
            color: var(--primary);
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <h1><i class="fas fa-lock"></i> Reset Password</h1>
            <p>Enter your new password</p>
        </div>

        <div id="message" class="message" style="display: none;"></div>

        <form id="reset-form">
            <input type="hidden" id="token" value="">
            <input type="hidden" id="email" value="">

            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" required placeholder="Enter new password (min 6 chars)">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" required placeholder="Confirm new password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-save"></i> Reset Password
            </button>
        </form>

        <a href="/login" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>

    <script src="config.js?v=13"></script>
    <script src="api-service.js?v=13"></script>
    <script>
        // Get token and email from URL
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('token').value = urlParams.get('token') || '';
        document.getElementById('email').value = urlParams.get('email') || '';

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const messageDiv = document.getElementById('message');
            
            if (!token) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Invalid or missing reset token.';
                messageDiv.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Passwords do not match.';
                messageDiv.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Password must be at least 6 characters.';
                messageDiv.style.display = 'block';
                return;
            }

            try {
                // Use apiService
                const result = await apiService.resetPassword(token, newPassword);
                
                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.innerHTML = '<i class="fas fa-check-circle"></i> ' + (result.message || 'Password reset successfully!');
                    document.getElementById('reset-form').style.display = 'none';
                    
                    // Optional: redirect to login after a few seconds
                    setTimeout(() => {
                        window.location.href='/login';
                    }, 3000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + (result.message || result.detail || 'Failed to reset password.');
                }
            } catch (error) {
                console.error('Reset password error:', error);
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error: ' + (error.message || 'An error occurred.');
            }
            
            messageDiv.style.display = 'block';
        });
    </script>
</body>
</html>
